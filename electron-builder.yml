appId: com.studycoach.desktop
productName: ASAKI
copyright: Copyright © 2026 ASAKI contributors

directories:
  output: dist
  buildResources: build

# electron-vite emits main, preload and renderer bundles into out/.
# Production dependencies are added automatically from package.json.
files:
  - out/**/*
  - package.json
  - LICENSE

asar: true

mac:
  category: public.app-category.education
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # arm64-only for v1. `dir` is the fast local verification target; zip and dmg
  # are the distributable artifacts.
  target:
    - target: dir
      arch: [arm64]
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  # Signing is optional. Set CSC_LINK/CSC_KEY_PASSWORD (or CSC_NAME) in the
  # environment to sign; otherwise electron-builder produces an unsigned build.
  # For notarization set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID.
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  # A 1024px PNG is checked in; electron-builder converts it to the .ico the
  # installer needs. Add build/icon.ico if a hand-tuned icon is preferred.
  icon: build/icon.png
  # x64 only for v1, matching the tested Windows target.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Signing is optional: set CSC_LINK/CSC_KEY_PASSWORD (or a certificate in the
  # store) to sign the installer and executable; otherwise the build is unsigned.
  # SmartScreen will warn about an unsigned installer on other machines.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ASAKI
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

artifactName: ${productName}-${version}-${arch}.${ext}
